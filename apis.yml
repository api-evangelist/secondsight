aid: secondsight
name: SecondSight
description: >-
  SecondSight is a Bloomington, Indiana software company building a "vertical AI"
  operating system for cyber insurance and digital risk. Its Digital Risk Management
  Platform packages three SaaS surfaces — Company Workbench (digital asset inventory,
  privacy and vulnerability scanning, insurability preparation), Broker Workbench
  (client management, auto-complete applications, quote/bind automation, book value and
  portfolio analytics) and Underwriter Workbench (risk prediction, portfolio balancing,
  mitigation) — alongside Exposurescape, a digital-telematics engine for exposure
  detection and catastrophic-event forecasting. The company was founded in 2019, came
  out of stealth in 2022 with a seed round led by Tim Crown, and sells to brokers,
  carriers, MGUs and reinsurers. SecondSight publishes pricing, a SOC 2 security
  commitments page and a Better Stack status page for its Risk Workbench service, but
  as of this pass it operates no public developer program — no developer portal, API
  reference, SDK, or machine-readable contract of any kind is published.
